<text x="236" y="294" font-size="11.5" fill="#5d6478">Drive ladder: public 17-token prompt, median of three runs per rung (2026-09-08); “+N external” add byte-identical replicas</text>
<text x="236" y="310" font-size="11.5" fill="#5d6478">of the expert set on Thunderbolt 5 NVMe. Four drives hold 1.00 tok/s steady over 512 generated tokens, 1.13 over 128.</text>
<text x="236" y="326" font-size="11.5" fill="#5d6478">A 512-token prompt takes about six minutes to first token. Engine and package: argonautlabsai/deltafin.</text>
